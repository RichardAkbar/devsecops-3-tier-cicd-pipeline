apiVersion: v1
kind: Service
metadata:
  name: richard-petstore
  namespace: petstore
  labels:
    app: richard-petstore
    component: application
spec:
  type: ClusterIP
  selector:
    app: richard-petstore
    component: application
  ports:
    - name: http
      port: 80
      targetPort: 8081
      protocol: TCP
