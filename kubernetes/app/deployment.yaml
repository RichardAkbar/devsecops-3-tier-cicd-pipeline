apiVersion: apps/v1
kind: Deployment
metadata:
  name: richard-petstore
  namespace: petstore
  labels:
    app: richard-petstore
    component: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: richard-petstore
      component: application
  template:
    metadata:
      labels:
        app: richard-petstore
        component: application
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: richard-petstore
          image: docker-host:5000/richard-petstore/richard-petstore:1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - secretRef:
                name: petstore-db-credentials
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
