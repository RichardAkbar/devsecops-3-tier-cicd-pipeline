apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  labels:
    app: richard-petstore
    component: mysql
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/richard-petstore/mysql
    type: Directory
